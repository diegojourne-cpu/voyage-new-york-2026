name: Régénérer le programme

# À chaque modification des données, des outils ou de l'appli : vérification du planning,
# génération de l'appli (dist/site), des cartes du PDF et du PDF, puis enregistrement.
# Cloudflare Pages publie automatiquement dist/site à chaque commit sur main.
on:
  push:
    branches: [main]
    paths: ["data/**", "tools/**", "site/**", "functions/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-programme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dépendances
        run: |
          pip install -r requirements.txt
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Itinéraires à pied réels (OpenStreetMap)
        run: python tools/itineraires.py || echo "itinéraires indisponibles : lignes droites conservées"
      - name: Vérification de faisabilité
        run: python tools/check.py
      - name: Génération (appli, agenda, KML, cartes, PDF)
        run: |
          python tools/build.py | tee build.log
          node tools/render_pdf.mjs
      - name: Enregistrer dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist site/tiles/zones.geojson data/itineraires.json
          git diff --cached --quiet || git commit -m "Régénération automatique de dist/"
          git pull --rebase
          git push
      - name: Ré-extraire le fond de carte si les zones ont changé
        if: ${{ hashFiles('build.log') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q ZONES_CHANGEES build.log; then gh workflow run tiles.yml --ref main; fi
      - name: Échouer s'il reste une erreur de planning
        run: python tools/check.py --strict
