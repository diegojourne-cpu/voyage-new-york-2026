name: Régénérer le programme

on:
  push:
    branches: [main]
    paths: ["data/**", "tools/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-programme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dépendances
        run: |
          pip install -r requirements.txt
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Vérification de faisabilité
        run: python tools/check.py
      - name: Génération (site, carte, agenda, KML, PDF)
        run: |
          python tools/build.py
          node tools/render_pdf.mjs
      - name: Publier dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "Régénération automatique de dist/"
          git push
      - name: Échouer s'il reste une erreur de planning
        run: python tools/check.py --strict
