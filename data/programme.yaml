- date: 2026-12-27
  titre: "Arrivée à New York"
  theme: "Atterrissage, taxi jaune, premières lumières de Manhattan"
  couleur: "#8a8f98"
  depart: "20:00"
  etapes:
    - lieu: jfk
      titre: "Atterrissage à JFK"
      duree: 80
      quoi: "Débarquement, contrôle des passeports (ESTA), récupération des bagages. Un dimanche soir des fêtes : prévoir 45 à 90 min."
      conseil: "Pendant l'attente, télécharger les applis : OMNY (facultatif), NYC Ferry, TrainTime (Metro-North), Citymapper. Passer les cartes bancaires en mode sans contact."
    - lieu: hotel
      titre: "Taxi jaune → hôtel"
      trajet: { mode: taxi, duree: 50, detail: "File officielle « Taxi » à la sortie du terminal. Forfait JFK ↔ Manhattan 70 $ + suppléments (~10 $) + pourboire 15-20 % ≈ 95-100 $ pour 3 (≈ 32 $/pers.). Refuser tout chauffeur qui vous aborde dans le hall.", prix: 33 }
      duree: 15
      quoi: "Check-in. Si l'énergie le permet : 5 min à pied jusqu'à Times Square pour le premier choc lumineux, puis dodo."
      conseil: "Alternative économique : AirTrain jusqu'à Jamaica (tarif de groupe 8,75 $ + 4,50 $ par personne en plus = 17,75 $ pour 3) puis métro E direct jusqu'à 42 St–Port Authority (3 $ chacun) : ≈ 27 $ pour 3, mais 75-90 min avec les valises."

