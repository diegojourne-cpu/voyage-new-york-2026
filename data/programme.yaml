# ============================================================================
#  PROGRAMME — LA source de vérité du planning
#
#  Les HEURES NE SONT PAS SAISIES : elles sont calculées en cascade par tools/
#  à partir de l'heure de départ du jour, des durées de trajet (+15 % de marge
#  automatique) et des durées sur place.
#
#  Champs d'une étape :
#    lieu        identifiant dans lieux.yaml
#    titre       (facultatif) remplace le nom du lieu
#    trajet      depuis l'étape précédente :
#                  mode: marche | metro | train | ferry | taxi
#                  lignes: [A, C]  de: "station"  a: "station"
#                  duree: minutes porte-à-porte (marche incluse), SANS la marge
#                  (pour la marche, durée calculée automatiquement si absente)
#    creneau     "HH:MM" : réservation à heure fixe → on attend si on est en avance,
#                ALERTE si on arrive en retard
#    pas_avant   "HH:MM" : ne pas commencer avant (ouverture, lumière…)
#    duree       minutes sur place (file, vestiaire, sécurité compris)
#    quoi        ce qu'on y fait concrètement
#    conseil     (facultatif) astuce logistique
#    nuit: true  l'étape doit se dérouler après le coucher du soleil (vérifié)
#    coucher: true  l'étape doit englober le coucher du soleil (vérifié)
#
#  Pour modifier : changer une durée, déplacer un bloc, remplacer un lieu,
#  puis lancer `make` (ou demander à Claude). Tout se recalcule et se vérifie.
# ============================================================================

jours:

