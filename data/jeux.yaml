quiz:
  - q: "Depuis quelle année le MET installe-t-il son sapin aux anges et sa crèche napolitaine ?"
    choix: ["1907", "1957", "1987"]
    r: 1
  - q: "Qui a terminé en 4 mois la rénovation de la patinoire Wollman en 1986 ?"
    choix: ["Michael Bloomberg", "Donald Trump", "Robert De Niro"]
    r: 1
  - q: "Que signifie DUMBO ?"
    choix: ["Down Under the Manhattan Bridge Overpass", "Downtown Upper Manhattan Brooklyn Office", "Un éléphant de Disney"]
    r: 0
  - q: "Combien de répliques de monuments compte le Holiday Train Show du Botanical Garden ?"
    choix: ["environ 50", "environ 190", "plus de 1 000"]
    r: 1
  - q: "En quoi sont fabriquées ces répliques ?"
    choix: ["Lego", "Matériaux végétaux (écorce, glands, graines…)", "Pain d'épices"]
    r: 1
  - q: "Combien de jours a-t-il fallu pour construire l'Empire State Building ?"
    choix: ["410", "1 200", "2 500"]
    r: 0
  - q: "Les constellations du plafond de Grand Central sont…"
    choix: ["exactement comme dans le ciel", "inversées, vues de l'extérieur de la sphère céleste", "inventées"]
    r: 1
  - q: "Quelle largeur fait la maison la plus étroite de New York (75½ Bedford St) ?"
    choix: ["2,9 m", "4,5 m", "1,8 m"]
    r: 0
  - q: "Où sont mesurées toutes les distances officielles vers New York ?"
    choix: ["Times Square", "Columbus Circle", "City Hall"]
    r: 1
  - q: "Combien pèse l'étoile du sapin du Rockefeller Center ?"
    choix: ["40 kg", "400 kg", "4 tonnes"]
    r: 1
  - q: "Qui a lancé les décorations de Dyker Heights en 1986 ?"
    choix: ["Lucy Spata", "Le maire de Brooklyn", "Macy's"]
    r: 0
  - q: "Depuis quand le ferry de Staten Island est-il gratuit ?"
    choix: ["1897", "1997", "2017"]
    r: 1
  - q: "Quelle est la plus ancienne entreprise de New York encore en activité sous son nom ?"
    choix: ["Macy's", "Bowne & Co.", "Tiffany & Co."]
    r: 1
  - q: "Pendant quelles années la boule de Times Square n'est-elle pas descendue ?"
    choix: ["1942 et 1943", "1918 et 1919", "2020 et 2021"]
    r: 0
