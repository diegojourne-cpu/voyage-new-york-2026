bingo:
  titre: "Bingo de Noël new-yorkais"
  regle: "Cochez une case quand l'un de vous la repère. Ligne = un chocolat chaud offert par les deux autres. Carton plein = le perdant… n'existe pas, c'est Noël."
  cases:
    - "Un Père Noël qui fait la manche"
    - "Un chien en pull de Noël"
    - "Un écureuil de Central Park"
    - "De la vapeur qui sort d'une bouche d'égout"
    - "Un taxi jaune décoré"
    - "Quelqu'un qui patine (vraiment) bien"
    - "Un bretzel géant"
    - "Une limousine blanche"
    - "Un pompier new-yorkais"
    - "Un sapin vendu sur le trottoir"
    - "Le mot « Happy Holidays » sur un camion"
    - "Une vitrine animée"
    - "Un musicien dans le métro"
    - "Un cheval de calèche à Central Park"
    - "Un pull « ugly Christmas sweater »"
    - "Un bonhomme de neige gonflable"
    - "La silhouette du Chrysler Building"
    - "Un bagel au saumon"
    - "Un rat (photo non obligatoire)"
    - "Une couronne sur une porte de brownstone"
    - "Un hot-dog avec choucroute"
    - "Un drapeau américain géant"
    - "Une pancarte « Don't Walk » qui clignote"
    - "Un Mariachi dans la ligne 7"
    - "Une file d'attente de plus de 50 personnes"

