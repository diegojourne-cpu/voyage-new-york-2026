  source: "https://www.rockefellercenter.com/magazine/arts-culture/top-of-the-rock/"
  verifie_le: 2026-11-24
  heure_creuse: "Créneau de 16 h = coucher du soleil (16 h 35) puis heure bleue (17 h 05). C'est le créneau le plus demandé : réserver dès l'achat du pass."
  astuce_photo: "Côté nord (67e étage puis 70e) : Central Park enneigé et les tours de Billionaires' Row. Côté sud : l'Empire State en plein cadre, s'illuminant vers 16 h 50. Coller l'objectif aux vitres du 67e pour éviter les reflets, ou monter au 70e qui est à l'air libre."
  anecdote: "L'observatoire a fermé de 1986 à 2005. La célèbre photo « Lunch atop a Skyscraper » (ouvriers sur une poutre, 1932) a été prise sur ce chantier, au 69e étage."

