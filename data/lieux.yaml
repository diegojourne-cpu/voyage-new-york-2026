  anecdote: "En 1986, la Ville bloquait la rénovation depuis 6 ans ; un promoteur nommé Donald Trump l'a terminée en 4 mois. La patinoire apparaît dans « Love Story », « Maman, j'ai encore raté l'avion » et « Serendipity »."

