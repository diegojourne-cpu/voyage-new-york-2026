  anecdote: "Les vitrines de Bergdorf Goodman demandent près d'un an de travail à une équipe de dizaines d'artisans ; elles sont dévoilées fin novembre et n'affichent presque jamais de vêtements à vendre."
  noel: "Vitrines de Noël de la 5e Avenue, de fin novembre à début janvier."

