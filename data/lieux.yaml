  anecdote: "Le plafond est peint « à l'envers » : les constellations sont vues de l'extérieur de la sphère céleste. Un petit carré sombre près du Cancer montre la crasse d'avant la restauration de 1998, laissé exprès."
  noel: "Le marché de Noël (Holiday Fair) ferme le 24 décembre ; le Holiday Train Show gratuit du Transit Museum (galerie du passage de la navette, lun-ven 10h-19h30) reste ouvert."

times_square:
