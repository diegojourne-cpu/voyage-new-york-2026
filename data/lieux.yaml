  verifie_le: 2026-11-24
  heure_creuse: "Les stands ferment à 20 h. 18 h 30-20 h en semaine : de la lumière, moins de monde qu'en journée."
  astuce_photo: "Depuis la terrasse de la New York Public Library (côté 42e Rue), le sapin + la patinoire + l'Empire State dans le même cadre."
  anecdote: "Bryant Park a été construit sur l'ancien réservoir de Croton. Sous la pelouse, on trouve aujourd'hui les rayonnages souterrains de la bibliothèque publique, avec des millions de livres."
  noel: "Le marché de Noël préféré des New-Yorkais : ~180 stands vitrés, patinoire gratuite, grand sapin."

grand_central:
