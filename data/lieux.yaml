# ============================================================================
#  BASE DES LIEUX — horaires, prix, sources, astuces photo, anecdotes
#  Chaque lieu est référencé par son identifiant (clé) dans programme.yaml / options.yaml.
#
#  horaires : par jour de semaine (lun mar mer jeu ven sam dim) au format "HH:MM-HH:MM"
#             ou "ferme". "00:00-24:00" = toujours accessible (rue, parc…).
#  exceptions : dates précises (AAAA-MM-JJ) qui remplacent la règle de la semaine.
#  derniere_entree : minutes avant la fermeture après lesquelles on ne peut plus entrer.
#  fiabilite : confirme (site officiel / annonce 2026) · probable (schéma des années
#              précédentes ou sources concordantes) · a_verifier (sources contradictoires).
#  prix : par adulte, en USD. pass : citypass (5 au choix) / call (C-All).
# ============================================================================

