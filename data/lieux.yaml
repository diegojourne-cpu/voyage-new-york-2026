  heure_creuse: "Le soir après 19 h : moins de monde, boules illuminées."
  astuce_photo: "Accroupi à 1 m d'une boule géante, en contre-plongée : votre reflet + les gratte-ciel déformés dedans. Puis l'enseigne néon de Radio City à 50 m."
  anecdote: "Les boules rouges (jusqu'à 3,6 m de haut) sont installées chaque année depuis 2009 devant le 1251 de la 6e Avenue ; Radio City, ouvert en 1932, était à l'époque la plus grande salle de spectacle couverte du monde."

