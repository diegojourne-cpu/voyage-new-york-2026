  verifie_le: 2026-11-24
  heure_creuse: "Le soir en semaine après 21 h, ou tôt le matin. Entre 17 h et 20 h, file d'accès canalisée (5-15 min)."
  astuce_photo: "Depuis la 5e Avenue, en haut des Channel Gardens : les anges trompettistes lumineux encadrent le sapin. Pour la patinoire + le sapin, se mettre à la rambarde côté 50e Rue."
  anecdote: "Le premier sapin (1931) a été dressé par les ouvriers du chantier, qui y ont accroché… des guirlandes de papier et des boîtes de conserve. L'étoile Swarovski pèse 400 kg et compte 3 millions de cristaux."
  noel: "LE sapin de Noël de New York, ~25 m, 50 000 LED."

