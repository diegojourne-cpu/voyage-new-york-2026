<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>Carte pour le PDF</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
@font-face{font-family:"InterVar";src:url("vendor/fonts/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900}
html,body{margin:0;background:#fff}
#m{width:1720px;height:925px}
#m.ensemble{width:1400px;height:1000px}
.pin{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);font:700 15px/1 "InterVar",Arial,sans-serif;display:grid;place-items:center;padding:0}
.pin.hotel{background:#1d1d1f;border-radius:10px}
.maplibregl-ctrl-attrib{font:11px Arial,sans-serif}
</style></head><body>
<div id="m"></div>
<script src="vendor/maplibre-gl.js"></script><script src="vendor/pmtiles.js"></script><script src="vendor/basemaps.js"></script><script src="carte.js"></script>
<script>
(async () => {
  const D = await (await fetch("data.json")).json();
  const q = new URLSearchParams(location.search), iso = q.get("jour");
  if (!iso) document.getElementById("m").className = "ensemble";
  const jours = iso ? D.jours.filter(j => j.iso === iso) : D.jours.filter(j => j.iso !== "2026-12-27");
  const b = jours.map(j => j.bounds);
  const bounds = [[Math.min(...b.map(x => x[0][0])), Math.min(...b.map(x => x[0][1]))], [Math.max(...b.map(x => x[1][0])), Math.max(...b.map(x => x[1][1]))]];
  const feats = jours.flatMap(j => j.features);
  const map = Carte.creer("m", { theme: "clair", bounds, features: feats, jour: null, padding: 70, impression: true, onload: m => {
    const h = document.createElement("div"); h.className = "pin hotel"; h.textContent = "H";
    new maplibregl.Marker({ element: h }).setLngLat([D.hotel[1], D.hotel[0]]).addTo(m);
    for (const j of jours) for (const e of j.etapes) {
      if (!e.n || (e.id_lieu === "jfk" && j.iso !== "2026-12-27")) continue;
      new maplibregl.Marker({ element: Carte.pastille(iso ? e.n : "", j.couleur) }).setLngLat([e.coord[1], e.coord[0]]).addTo(m);
    }
    m.once("idle", () => setTimeout(() => { window.carteprete = true; }, 400));
  }});
})();
</script></body></html>
